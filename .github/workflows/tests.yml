name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install and verify dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Compile source
        run: python -m compileall -q src tests

      - name: Lint source, tests, and release tooling
        run: python -m ruff check .

      - name: Run tests with coverage
        run: python -m pytest --cov=src --cov-report=term-missing --cov-fail-under=90

      - name: Run complete synthetic release smoke test
        run: |
          python -m src.release \
            --output-root data/ci-release \
            --run-version ci-${{ github.sha }}

      - name: Confirm generated artifacts remain untracked
        run: test -z "$(git status --porcelain --untracked-files=all)"
