[project]
name = "affectra"
version = "1.0.0"
description = "Explainable customer-service workload and stress-risk analytics"
requires-python = ">=3.12"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
